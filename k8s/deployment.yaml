
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18.6
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: expense_splitter
            - name: POSTGRES_USER
              value: expense_app
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: expense-db-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - expense_app
                - -d
                - expense_splitter
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: postgres-data
          emptyDir: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-splitter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expense-splitter
  template:
    metadata:
      labels:
        app: expense-splitter
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:18.6
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432 -U expense_app -d expense_splitter; do echo "Waiting for PostgreSQL"; sleep 5; done
      containers:
        - name: expense-splitter
          image: 917914000501.dkr.ecr.ap-south-1.amazonaws.com/expense-splitter:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/expense_splitter
            - name: DB_USERNAME
              value: expense_app
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: expense-db-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: expense-splitter-service
spec:
  type: LoadBalancer
  selector:
    app: expense-splitter
  ports:
    - port: 80
      targetPort: 8081
      protocol: TCP
