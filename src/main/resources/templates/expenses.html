<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Expenses</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="navbar">
    <h2>Expense Splitter</h2>

    <div>
        <a href="/">Dashboard</a>
        <a href="/friends">Friends</a>
        <a href="/groups">Groups</a>
        <a href="/expenses">Expenses</a>
        <a href="/balances">Balances</a>
    </div>
</div>

<div class="container">

    <h1>Manage Expenses</h1>

    <div th:if="${success}" class="success" th:text="${success}"></div>
    <div th:if="${error}" class="error" th:text="${error}"></div>

    <div class="card">

        <h2>Add New Expense</h2>

        <form action="/expenses" method="post">

            <label>Expense Title</label>

            <input
                type="text"
                name="title"
                placeholder="Example: Hotel Booking"
                required
            >

            <label>Amount (₹)</label>

            <input
                type="number"
                name="amount"
                min="0.01"
                step="0.01"
                placeholder="3000"
                required
            >

            <label>Select Group</label>

            <select name="groupId" required>

                <option value="">Select a group</option>

                <option
                    th:each="group : ${groups}"
                    th:value="${group.id}"
                    th:text="${group.name}">
                </option>

            </select>

            <label>Paid By</label>

            <select name="payerId" required>

                <option value="">Select payer</option>

                <option
                    th:each="friend : ${friends}"
                    th:value="${friend.id}"
                    th:text="${friend.name}">
                </option>

            </select>

            <button type="submit">Add Expense</button>

        </form>

        <p class="subtitle">
            Expenses are automatically divided equally among all members
            of the selected group.
        </p>

    </div>

    <div class="card">

        <h2>Expense History</h2>

        <table>

            <thead>
                <tr>
                    <th>Title</th>
                    <th>Group</th>
                    <th>Paid By</th>
                    <th>Amount</th>
                    <th>Date</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="expense : ${expenses}">

                    <td th:text="${expense.title}"></td>

                    <td th:text="${expense.group.name}"></td>

                    <td th:text="${expense.paidBy.name}"></td>

                    <td>
                        ₹<span th:text="${#numbers.formatDecimal(expense.amount, 1, 2)}"></span>
                    </td>

                    <td th:text="${#temporals.format(expense.createdAt, 'dd-MM-yyyy HH:mm')}"></td>

                </tr>

                <tr th:if="${#lists.isEmpty(expenses)}">
                    <td colspan="5">No expenses added yet.</td>
                </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
