spring.application.name=expense-splitter

server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expense_splitter}
spring.datasource.username=${DB_USERNAME:expense_app}
spring.datasource.password=${YourStrongPasswordHere}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

logging.level.org.springframework=INFO